<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warren B — Financial Advisor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
  .badge { background: #1f2937; border: 1px solid #30363d; border-radius: 12px; padding: 4px 12px; font-size: 12px; color: #8b949e; }
  .badge.green { border-color: #238636; color: #3fb950; }
  #goal-badge { margin-left: auto; white-space: nowrap; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 900px; }
  .msg.user { align-self: flex-end; }
  .msg.warren { align-self: flex-start; }
  .sender { font-size: 11px; color: #6e7681; margin-bottom: 4px; padding: 0 4px; }
  .msg.warren .sender { color: #58a6ff; }
  .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; font-size: 14px; }
  .msg.user .bubble { background: #1f6feb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.warren .bubble { background: #161b22; border: 1px solid #30363d; border-bottom-left-radius: 4px; }
  .typing { color: #8b949e; font-style: italic; font-size: 13px; padding: 4px 16px; }
  #input-area { background: #161b22; border-top: 1px solid #30363d; padding: 16px 20px; display: flex; gap: 10px; flex-shrink: 0; }
  #msg-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; color: #e6edf3; font-size: 14px; resize: none; height: 44px; line-height: 22px; font-family: inherit; }
  #msg-input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1); }
  #send-btn { background: #1f6feb; color: #fff; border: none; border-radius: 8px; padding: 0 18px; font-size: 14px; cursor: pointer; font-weight: 500; white-space: nowrap; height: 44px; }
  #send-btn:hover:not(:disabled) { background: #388bfd; }
  #send-btn:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }
  @media (max-width: 600px) { #header { flex-wrap: wrap; } #goal-badge { margin-left: 0; } .bubble { font-size: 13px; padding: 10px 14px; } }
</style>
</head>
<body>

<div id="header">
  <h1>Warren B</h1>
  <span class="badge" id="vix-badge">VIX: —</span>
  <span class="badge" id="regime-badge">Regime: —</span>
  <span class="badge" id="goal-badge">Goal: $417K by Dec 2030</span>
</div>

<div id="chat">
  <div class="msg warren">
    <div class="sender">Warren B</div>
    <div class="bubble">Good morning. I'm ready when you are. You can ask me anything about the portfolio, the model's signals, or what you should be thinking about today. What's on your mind?</div>
  </div>
</div>

<div id="input-area">
  <textarea id="msg-input" placeholder="Ask Warren anything..." rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
const SESSION_ID = 'web-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
const chat = document.getElementById('chat');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');

async function loadRegime() {
  try {
    const res = await fetch('/health');
    if (res.ok) {
      document.getElementById('vix-badge').textContent = 'Live ✓';
      document.getElementById('vix-badge').classList.add('green');
    }
  } catch(e) {}
}
loadRegime();

function addMessage(role, content) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = role === 'warren' ? 'Warren B' : 'You';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  msg.appendChild(sender);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typing';
  el.textContent = 'Warren B is thinking...';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = '44px';
  sendBtn.disabled = true;
  addMessage('user', text);

  const typing = addTypingIndicator();

  const warrenBubble = document.createElement('div');
  warrenBubble.className = 'bubble';
  warrenBubble.textContent = '';
  const warrenMsg = document.createElement('div');
  warrenMsg.className = 'msg warren';
  const warrenSender = document.createElement('div');
  warrenSender.className = 'sender';
  warrenSender.textContent = 'Warren B';
  warrenMsg.appendChild(warrenSender);
  warrenMsg.appendChild(warrenBubble);

  try {
    const response = await fetch('/warren-b/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: SESSION_ID,
        interface: 'web',
      }),
    });

    typing.remove();
    chat.appendChild(warrenMsg);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let sessionIdReceived = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const chunk = line.slice(6);
          if (chunk === '[DONE]') break;
          if (chunk.startsWith('{')) {
            try {
              const json = JSON.parse(chunk);
              if (json.session_id && !sessionIdReceived) {
                sessionIdReceived = true;
              }
              if (json.content) {
                warrenBubble.textContent += json.content;
              }
            } catch (e) {
              // Fallback: append raw chunk if JSON parse fails
              warrenBubble.textContent += chunk;
            }
          } else if (chunk.startsWith('[ERROR]')) {
            warrenBubble.textContent += chunk;
          } else {
            warrenBubble.textContent += chunk;
          }
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
  } catch(e) {
    typing.remove();
    chat.appendChild(warrenMsg);
    warrenBubble.textContent = 'Something went wrong. Please try again.';
  }

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', () => {
  input.style.height = '44px';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
